<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#glowGrad)" stroke-width="6" opacity="0.6"/>

  <!-- Compass / Orbit Rings (Physics motif) -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Orbits -->
    <ellipse cx="0" cy="0" rx="160" ry="60" fill="none" stroke="#06b6d4" stroke-width="12" opacity="0.85" transform="rotate(-30)"/>
    <ellipse cx="0" cy="0" rx="160" ry="60" fill="none" stroke="#3b82f6" stroke-width="12" opacity="0.85" transform="rotate(30)"/>
    <ellipse cx="0" cy="0" rx="160" ry="60" fill="none" stroke="#a855f7" stroke-width="12" opacity="0.85" transform="rotate(90)"/>

    <!-- Electrons / Nodes -->
    <circle cx="138" cy="-80" r="14" fill="#38bdf8"/>
    <circle cx="-138" cy="80" r="14" fill="#818cf8"/>
    <circle cx="0" cy="160" r="14" fill="#c084fc"/>

    <!-- Central Core -->
    <circle cx="0" cy="0" r="44" fill="url(#glowGrad)"/>
    <circle cx="0" cy="0" r="24" fill="#ffffff"/>
  </g>
</svg>
